<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada | Jaques Barbosa Advocacia de Negócios</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#08083A">
  <link rel="icon" type="image/png" href="/assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --navy: #08083A; --gold: #A58900; --gold-grad: linear-gradient(135deg, #FFDF7F, #A58900); }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; min-height: 100svh;
      display: grid; place-items: center; text-align: center;
      padding: 32px 16px;
      background: var(--navy); color: #fff;
      font-family: Montserrat, system-ui, sans-serif;
    }
    main { max-width: 440px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
    img { width: 190px; height: auto; }
    .code { font-family: 'Cormorant Garamond', serif; font-size: clamp(72px, 18vw, 120px); line-height: 1;
      background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 30px; }
    p { color: rgba(255,255,255,.7); font-size: 15px; line-height: 1.6; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    a.btn { display: inline-block; padding: 14px 26px; border-radius: 999px; font-size: 12px; font-weight: 600;
      letter-spacing: .14em; text-transform: uppercase; text-decoration: none; transition: transform .3s; }
    a.btn:hover { transform: translateY(-2px); }
    .btn--gold { background: var(--gold-grad); color: var(--navy); }
    .btn--line { border: 1px solid rgba(255,255,255,.3); color: #fff; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/img/logo-v-light.svg" alt="Jaques Barbosa Advocacia de Negócios">
    <span class="code">404</span>
    <h1>Página não encontrada</h1>
    <p>O endereço que você acessou não existe ou foi movido. Que tal voltar ao início?</p>
    <div class="actions">
      <a class="btn btn--gold" href="/">Ir para o site</a>
      <a class="btn btn--line" href="/links">Redes e materiais</a>
    </div>
  </main>
</body>
</html>
